name: Release

# A pushed tag v1.2.3 publishes Murmur 1.2.3. Run it by hand to get the zip as a build artifact without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
      - name: Test
        run: swift build -c release --product murmur-cli && .build/release/murmur-cli test
      - name: Build whisper.cpp and the app, and zip it
        run: ./scripts/package.sh
      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: murmur
          path: dist/*
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          gh release create "$GITHUB_REF_NAME" dist/Murmur-$VERSION.zip dist/Murmur-$VERSION.zip.sha256 \
            --title "Murmur $VERSION" --generate-notes \
            --notes "Install or update: \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | bash\`"
